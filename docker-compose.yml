services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: household_budget_mate
      POSTGRES_USER: household_budget_mate
      POSTGRES_PASSWORD: household_budget_mate
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U household_budget_mate -d household_budget_mate"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      PORT: 10000
      HOUSEHOLDBUDGETMATE_DATA_DIR: /var/lib/householdbudgetmate
      Application__MigrateDatabaseOnStart: "true"
      Application__SeedDataToDatabase: "false"
      WebHosting__EnableLanAccess: "false"
    ports:
      - "10000:10000"
    volumes:
      - web-data:/var/lib/householdbudgetmate
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  web-data:
